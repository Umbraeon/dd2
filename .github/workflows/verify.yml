name: Validação do guia
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Validate questlog ZIP audit verifier CLI (no game assets on CI)
        run: python3 scripts/verify-questlog-package.py --help
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # A verificação padrão testa o aplicativo atual. Probes externos do MapGenie
      # e capturas presas à revisão PR C permanecem como scripts manuais;
      # não são gates determinísticos da Jornada.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-navegador
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
