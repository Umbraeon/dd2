name: Validação do guia
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Investigar renderização externa do MapGenie em Chromium (diagnóstico, não aceite)
        run: |
          (npm run dev -- --port 3011 --host 127.0.0.1 > /tmp/dd2-pr-d-probe.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3011/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/probe-mapgenie-embed.mjs
      - run: npm run test:e2e
      - name: Capturas comparativas da main anterior (mesmo estado inicial)
        if: always()
        run: |
          git worktree add --detach /tmp/dd2-pr-c-baseline 438abf4c5a31ae8ca074837c06b0faa17dfd9267
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/dd2-pr-c-baseline/node_modules
          (cd /tmp/dd2-pr-c-baseline && npm run dev -- --port 3001 --host 127.0.0.1 > /tmp/dd2-pr-c-baseline.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then break; fi
            sleep 2
          done
          node --import tsx scripts/capture-tools-hub-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-navegador
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
